<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Swipe to Unlock</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#10b981;
      --muted:#94a3b8;
      --danger:#ef4444;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg,#071029 0%, #071a2a 100%);
      color:#e6eef6;
    }

    .card{
      width: min(680px, 92vw);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:28px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.03);
    }

    h1{margin:0 0 8px 0;font-size:20px}
    p{margin:0 0 18px 0;color:var(--muted);font-size:13px}

    .slider{
      position:relative;
      height:66px;
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.03);
      overflow:hidden;
      user-select:none;
      touch-action:none;
      display:flex;
      align-items:center;
      padding:10px;
    }
    .track{
      position:absolute;
      inset:10px;
      border-radius:10px;
      background: linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      z-index:1;
    }
    .hint{
      position:relative;
      z-index:2;
      width:100%;
      text-align:center;
      font-weight:600;
      color:var(--muted);
      pointer-events:none;
      font-size:15px;
      letter-spacing:0.25px;
    }

    .knob{
      position:relative;
      z-index:3;
      width:56px;
      height:56px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      transition: transform 120ms ease, left 120ms ease;
      left:10px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      border:1px solid rgba(255,255,255,0.04);
    }

    .knob .arrow {
      width:0; height:0;
      border-top:9px solid transparent;
      border-bottom:9px solid transparent;
      border-left:12px solid var(--muted);
      transform: translateX(1px);
    }

    .progress {
      position:absolute;
      left:10px;
      top:10px;
      bottom:10px;
      width:0;
      background: linear-gradient(90deg, rgba(16,185,129,0.14), rgba(16,185,129,0.08));
      border-radius:10px;
      z-index:1;
      transition: width 120ms linear;
      pointer-events:none;
    }

    .status{
      margin-top:14px;
      font-size:13px;
      color:var(--muted);
      min-height:20px;
    }
    .status.success{ color:var(--accent) }
    .status.error{ color:var(--danger) }

    .small{
      margin-top:12px;
      font-size:12px;
      color:var(--muted);
    }

    button.reset{
      margin-left:8px;
      background:transparent;
      color:var(--muted);
      border:1px solid rgba(255,255,255,0.03);
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Swipe to unlock</h1>
    <p>Slide the knob to the right to trigger the unlock endpoint.</p>

    <div id="sliderContainer" class="slider">
      <div class="track"></div>
      <div id="progress" class="progress"></div>
      <div id="hint" class="hint">Swipe to unlock →</div>
      <div id="knob" class="knob">
        <div class="arrow"></div>
      </div>
    </div>

    <div class="status" id="status">Ready.</div>

    <div class="small">
      <button id="resetBtn" class="reset">Reset slider</button>
    </div>
  </div>

  <script>
    const RPC_URL = "https://ubmaawldxixfdrpiiaut.supabase.co/functions/v1/unlock";

    const knob = document.getElementById('knob');
    const container = document.getElementById('sliderContainer');
    const progress = document.getElementById('progress');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    let dragging = false;
    let startX = 0;
    let knobLeft = 10;
    let maxLeft = 0;
    let containerRect = null;

    function updateDimensions(){
      containerRect = container.getBoundingClientRect();
      const knobRect = knob.getBoundingClientRect();
      maxLeft = containerRect.width - knobRect.width - 10;
    }

    updateDimensions();
    window.addEventListener('resize', updateDimensions);

    function setKnobPos(px){
      px = Math.max(10, Math.min(px, maxLeft + 10));
      knob.style.left = px + 'px';

      const progW = (px - 10) + knob.offsetWidth;
      progress.style.width = Math.max(0, Math.min(containerRect.width - 20, progW)) + "px";
    }

    knob.addEventListener('pointerdown', e => {
      dragging = true;
      startX = e.clientX;
      knob.setPointerCapture(e.pointerId);
    });

    document.addEventListener('pointermove', e => {
      if(!dragging) return;
      const delta = e.clientX - startX;
      const newLeft = knobLeft + delta;
      setKnobPos(newLeft);
    });

    document.addEventListener('pointerup', () => {
      if(!dragging) return;
      dragging = false;

      const knobRect = knob.getBoundingClientRect();
      const relative = knobRect.left - containerRect.left;
      const threshold = 0.75 * (containerRect.width - knobRect.width);

      if(relative >= threshold){
        setKnobPos(maxLeft + 10);
        onUnlocked();
      } else {
        knobLeft = 10;
        setKnobPos(knobLeft);
        statusEl.textContent = 'Not far enough — try again.';
      }
    });

    async function onUnlocked(){
      statusEl.textContent = "Sending unlock request...";

      try {
        const response = await fetch(RPC_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}"
        });

        const text = await response.text();

        if(response.ok){
          statusEl.textContent = "Success: " + text;
          statusEl.className = "status success";
        } else {
          statusEl.textContent = "Error: " + text;
          statusEl.className = "status error";
        }

        statusEl.textContent = "";

      } catch (err) {
        statusEl.textContent = "Network error – see console.";
        statusEl.className = "status error";
        console.error(err);
      }
    }

    resetBtn.addEventListener('click', () => {
      knobLeft = 10;
      setKnobPos(knobLeft);
      statusEl.textContent = "Ready.";
      statusEl.className = "status";
    });

    knob.style.left = knobLeft + "px";
    window.addEventListener('load', () => {
      updateDimensions();
      setKnobPos(knobLeft);
    });
  </script>
</body>
</html>
